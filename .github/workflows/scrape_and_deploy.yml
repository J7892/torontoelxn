name: Scrape Election Results & Update Data

on:
  schedule:
    # Run every 3 minutes in the cloud
    - cron: '*/3 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - '.github/workflows/**'

permissions:
  contents: write

concurrency:
  group: "scrape-election-data"
  cancel-in-progress: false

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Scrape live election data
        run: |
          python scripts/scrape.py

      - name: Commit & push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --staged --quiet; then
            git commit -m "Live election update: $(date -u +'%Y-%m-%d %H:%M:%S UTC') [skip ci]"
            git push
          else
            echo "No data changes detected. Everything up to date."
          fi
