name: Scrape Election Results & Update Data

on:
  schedule:
    # Run every 5 minutes in GitHub Actions (standard minimum cron)
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - '.github/workflows/**'

permissions:
  contents: write

concurrency:
  group: "scrape-election-data"
  cancel-in-progress: false

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Scrape live election data in active 30s loop
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Run active scrape loop (checks live feeds every 30 seconds across ~4 minutes)
          for i in {1..8}; do
            echo "=== Scraping iteration $i/8 at $(date -u +'%T UTC') ==="
            python scripts/scrape.py

            git add data/
            if ! git diff --staged --quiet; then
              echo "New returns detected! Committing and pushing..."
              git commit -m "Live election update: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
              git pull --rebase origin main || true
              git push
            else
              echo "No data changes on iteration $i."
            fi

            if [ $i -lt 8 ]; then
              sleep 30
            fi
          done
