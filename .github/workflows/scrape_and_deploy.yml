name: Scrape Election Results & Update Data

on:
  schedule:
    # Run every 5 minutes in GitHub Actions (safety net cron)
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - '.github/workflows/**'

permissions:
  contents: write
  actions: write

concurrency:
  group: "scrape-election-data"
  cancel-in-progress: false

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Scrape live election data in active loop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Run 4 iterations spaced 75s apart (~5 minutes total).
          # 75s interval ensures GitHub Pages deployments (~35s) complete without being cancelled by new pushes.
          for i in {1..4}; do
            echo "=== Scraping iteration $i/4 at $(date -u +'%T UTC') ==="
            python scripts/scrape.py

            git add data/
            if ! git diff --staged --quiet; then
              echo "New returns detected! Committing and pushing..."
              git commit -m "Live election update: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
              git pull --rebase origin main || true
              git push
            else
              echo "No data changes on iteration $i."
            fi

            if [ $i -lt 4 ]; then
              echo "Waiting 75 seconds for GitHub Pages deployment before next check..."
              sleep 75
            fi
          done

          # Trigger the next continuous run to avoid cron queue lag
          echo "Queueing next run..."
          gh workflow run "Scrape Election Results & Update Data" || true
